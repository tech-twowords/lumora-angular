<div
  appInView
  mode="once"
  [enabled]="enabled()"
  [from]="cardInFrom"
  [to]="cardInTo"
  [config]="cardInConfig"
  [delayIn]="400"
  class="w-full max-w-sm rounded-card-sm bg-white/70 p-2 shadow-sm ring-1 ring-line/70 backdrop-blur-md lg:w-[19rem]"
>
  <div
    role="button"
    tabindex="0"
    (click)="go(1)"
    (keydown)="onKeydown($event)"
    aria-label="Next highlight"
    class="flex cursor-pointer items-stretch gap-2 rounded-control focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-accent"
  >
    <div class="grid aspect-square w-24 shrink-0 place-items-center rounded-control bg-ink text-3xl text-white">
      <app-logo-mark class="text-accent-from" />
    </div>
    <div class="flex flex-1 flex-col justify-between rounded-control bg-surface/70 p-3">
      <div class="relative min-h-[3.25rem] flex-1">
        <div
          class="absolute inset-0 flex flex-col gap-0.5"
          [class.transition-none]="skipTransition()"
          [class.transition-all]="!skipTransition()"
          [class.duration-200]="!skipTransition()"
          [class.ease-out]="!skipTransition()"
          [style.opacity]="opacity()"
          [style.transform]="'translateY(' + translateY() + 'px)'"
        >
          <span class="text-[0.65rem] font-medium uppercase tracking-wide text-foreground/45">
            {{ current().caption }}
          </span>
          <p class="max-w-[8rem] text-sm font-medium leading-snug">
            {{ current().title }}
          </p>
        </div>
      </div>
      <div class="flex items-center justify-between">
        <span class="flex items-center gap-1" aria-hidden>
          @for (card of cards(); track $index) {
            <span
              class="h-1 rounded-pill transition-all duration-300"
              [class.w-4]="$index === index()"
              [class.bg-foreground/70]="$index === index()"
              [class.w-1.5]="$index !== index()"
              [class.bg-foreground/20]="$index !== index()"
            ></span>
          }
        </span>
        <span class="flex items-center gap-1.5">
          <button
            type="button"
            aria-label="Previous"
            (click)="prev($event)"
            class="grid size-7 place-items-center rounded-pill bg-white text-foreground/70 ring-1 ring-line transition hover:text-foreground hover:ring-foreground/30"
          >
            <app-icon-arrow-right class="rotate-180 text-xs" />
          </button>
          <button
            type="button"
            aria-label="Next"
            (click)="next($event)"
            class="grid size-7 place-items-center rounded-pill bg-white text-foreground/70 ring-1 ring-line transition hover:text-foreground hover:ring-foreground/30"
          >
            <app-icon-arrow-right class="text-xs" />
          </button>
        </span>
      </div>
    </div>
  </div>
</div>
