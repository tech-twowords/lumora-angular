@if (visible()) {
  <section
    aria-label="Cookie consent"
    [style.opacity]="opacity()"
    [style.transform]="'translateY(' + y() + 'px)'"
    class="fixed bottom-4 left-4 right-4 z-50 flex flex-col gap-3 rounded-xl border border-foreground/10 bg-background/95 p-5 font-sans text-foreground shadow-2xl backdrop-blur-xl sm:bottom-12 sm:left-auto sm:right-12 sm:w-[420px] sm:p-6"
  >
    <h2 class="text-base font-medium leading-snug sm:text-lg">This website uses cookies</h2>
    <p class="text-sm leading-relaxed text-foreground/70">
      We use cookies to keep the site working, learn how it's used, and improve what we ship
      next. Accept everything, reject the non-essential, or pick category by category. See our
      <a
        href="/privacy-policy"
        target="_blank"
        rel="noopener noreferrer"
        class="underline underline-offset-2 hover:text-foreground/70"
        >privacy policy</a
      >.
    </p>
    <div class="mt-1 flex flex-wrap items-center gap-2">
      <app-cookie-button (clicked)="acceptAll()">Accept all</app-cookie-button>
      <app-cookie-button variant="secondary" (clicked)="rejectAll()">Reject all</app-cookie-button>
      <button
        type="button"
        (click)="openModal()"
        class="px-2 py-2 text-sm font-medium leading-none text-foreground underline underline-offset-2 hover:text-foreground/70 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-foreground"
      >
        Manage preferences
      </button>
    </div>
  </section>
}
